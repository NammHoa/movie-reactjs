services:
  - type: web
    name: movie-booking-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PAYMENT_GATEWAY
        value: vnpay
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: SERVER_URL
        sync: false
      - key: VNPAY_REFUND_API
        value: "off" # sandbox chưa bật API hoàn tiền: hoàn thủ công trong mục Hoàn tiền; đổi thành "on" khi VNPay đã bật
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Denim Cinema
      - key: MONGO_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
